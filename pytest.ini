[pytest]
# Un UnicodeDecodeError en el hilo que lee la salida de un subproceso llega como
# warning, no como fallo: el 2026-10-13 una prueba llevaba pasando asi, capturando
# basura y comprobando solo el codigo de salida. Esa clase de fallo silencioso es
# exactamente la que este kit no puede permitirse, porque se entrega sin soporte.
filterwarnings =
    error::pytest.PytestUnhandledThreadExceptionWarning
